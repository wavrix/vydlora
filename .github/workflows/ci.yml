name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install Lora 1 engine
        run: npm run setup -- --skip-browser
      - name: Syntax and web tests
        run: |
          npm run check
          npm test
      - name: Isolated engine tests
        run: npm run test:engine
      - name: Windows installer smoke check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((Get-Content ./install.ps1 -Raw))) -Directory $PWD.Path -NoUpdate -NoStart -SkipBrowser
      - name: macOS and Linux installer smoke check
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n install.sh
          bash install.sh --directory "$PWD" --no-update --no-start --skip-browser
